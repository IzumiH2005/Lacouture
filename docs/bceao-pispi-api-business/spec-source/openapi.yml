info:
  title: PI - API BUSINESS - OpenAPI 3.0
  x-logo:
    url: "https://developers.pi-bceao.com/assets/images/logo/Logo_SPI_1.png"

  description: |
    # Généralités

    L'API Business est une API exposée par les participants (PSP) de la Plateforme d'Interopérabilité PI à leurs clients business.

    Elle permet au participant de fournir des services d’automatisation des opérations de paiement à son client :

    - Créer des alias de compte
    - Recevoir des paiements
    - Retourner des paiements

    - Envoyer des paiements
    - Effectuer des paiements en masse
    - Envoyer des demandes d'annulation

    - Envoyer des demandes de paiements
    - Envoyer des demandes de paiements en masse

    - Consulter la liste des opérations
    - Consulter les détails d'une opération
    - Effectuer des transferts entre ses comptes
    - Consulter la liste des participants PI


    Cette spécification a pour but d'encadrer les solutions à valeurs ajoutées offertes par les participants à leurs clients business.
    Elle permettra ainsi de faciliter l'interopérabilité et d'éviter le cloisonnement des solutions techniques mises en œuvre.

    ## Gestion des versions

    La stratégie de développement de l'API est de maintenir la rétrocompatibilité entre l'API et ses ressources et services dans la mesure du possible.
    Les APIs utilisent la spécification __SemVer__ (La gestion sémantique de versions); en ce sens, les modifications compatibles ne doivent pas générer une nouvelle version majeure.

    La version de l’API utilise ainsi le format` MAJEUR.MINEUR.CORRECTIF`
    * le numéro de version `MAJEUR` quand il y a des changements non rétrocompatibles,
    * le numéro de version `MINEUR` quand il y a des ajouts de fonctionnalités rétrocompatibles,
    * le numéro de version de `CORRECTIF` quand il y a des corrections d’anomalies rétrocompatibles.

    Chaque fois qu'un changement dans ce document définissant les caractéristiques de l'API est mis à jour et affecte d'une manière ou d'une autre un service d'API, une nouvelle version de l’API sera publiée.
    La version initiale de chaque API est `1.0.0`.

    ### __1) Versions de correction__
    L’identifiant de version de correction est  incrémenté si des corrections rétrocompatibles sont introduites. Une correction est définie comme un changement interne qui corrige un comportement incorrect.

    ### __2) Versions mineures__
    Certaines modifications n'affectent pas la version de la ressource API; par exemple, si l'ordre des paramètres dans une requête change.

    La liste suivante décrit quelques modifications considérées comme rétrocompatibles. Les participants doivent implémenter leur système de manière à ce que les services d'API prennent automatiquement en charge ces modifications sans interrompre le fonctionnement du système:
    * paramètres de requêtes facultatifs
    * ajout de nouveaux codes d'erreur

    Ces types de modifications affectent la version mineure du service d'API.

    ### __3) Versions majeures__
    La liste suivante décrit les modifications considérées comme rétro-incompatibles si la modification affecte un service d'API connecté à une ressource. Les intégrateurs d'API n'ont pas besoin d'implémenter de manière à prendre automatiquement en charge ces modifications.
    En effet, pour des changements importants, un plan de migration sera défini et dépendra de la nature de ces changements.
    Les situations suivantes peuvent entraîner la publication d’une version majeure:
    * Paramètres obligatoires supprimés ou ajoutés à une requête
    * Paramètres facultatifs changés en obligatoires dans une requête
    * Paramètres renommés
    * Types de données modifiés
    * La logique métier d’un service modifiée
    * Les URI de ressource/service d'API modifiées

    Ces types de modifications affectent la version principale du service d'API. Veuillez noter que la liste n'est pas exhaustive ; il peut également y avoir d'autres modifications susceptibles d'affecter la version principale du service d'API.
    ### __4) Informations de version__
    La gestion des versions s’effectuera via le chemin URI qui consiste à inclure le numéro de version dans le chemin URI et permet de gérer facilement plusieurs versions parallèles de l’API.
    Le numéro de version majeure sera inclus dans l’URL de l’API comme suit: __https://www.example.com/api/v1/products__

    ## Notes de version
    Pour consulter les changements apportés à l'API, veuillez consulter le [changelog](./CHANGELOG.md).

    ## Gestion des erreurs

    L'API BUSINESS renvoie des codes d'états HTTP pour indiquer le succès ou l'échec à l'issue du traitement d'une requête

      - Les codes `2xx` indiquent un succès.

      - Les codes `4xx` indiquent un échec causé par les informations envoyées par le client ou l'état actuel des entités.

      - Les codes `5xx` généralement liés aux serveurs ou à l'application

      - Les réponses d'erreur incluent dans le corps les détails de l'erreur.

      - Le champ `type` identifie le type d'erreur rencontrée.

    En ce qui concerne les réponses notifiant une erreur, PI utilise le format décrit dans la `RFC 7807` qui décrit comment les API peuvent renvoyer des informations d'erreur de manière standardisée.  Une telle réponse contient les éléments suivants :
    <table>
      <tr>
        <td><b>type</b></td>
        <td>Le champ "type" est une URI unique qui identifie le type de problème. L’URI peut être relative.</td>
      </tr>
      <tr>
        <td><b>title</b></td>
        <td>Le champ "title"  fournit une description courte pour comprendre le problème. Il est identique pour le même type de problème.</td>
      </tr>
      <tr>
        <td><b>detail</b></td>
        <td>Le champ "detail" donne des explications sur le problème.</td>
      </tr>
      <tr>
        <td><b>instance</b></td>
        <td>Il indique une référence URI de ressource concernée par le problème. Il est optionnel.</td>
      </tr>
      <tr>
        <td><b>status</b></td>
        <td>Le champ "status" renvoie le code de statut HTTP qui a déclenché cette réponse. Ce champ est optionnel.</td>
      </tr>
    </table>

    Pour donner des informations détaillées sur le problème, des extensions sont permises. Les extensions sont des champs additionnels qui peuvent figurer dans la réponse.

    Ci-dessous un exemple de réponse en JSON:

    <img src="./images/exemple-erreur-json.png" />

    Ici, le problème `format-invalide` __(identifié par son type URI)__  indique la raison de l’erreur `400` retournée par le serveur lors de la création d’un client; deux extensions sont ajoutées: `typeClient` qui indique le __champ incorrect__, et `invalid-params` qui indiquent les __paramètres invalides et la raison d’invalidité__.
    Par ailleurs, l'URI de type d'un problème devrait référencer une page HTML expliquant comment résoudre le problème. Cependant des types prédéfinis existent: c’est le cas du type `about:blank` qui indique que __le problème n'a pas de sémantique supplémentaire au-delà de celle du code de statut HTTP__. Lorsque `about:blank` est utilisé, le champ `title` est le même que le libellé du statut HTTP comme montré dans l’exemple suivant:

    Les erreurs suivantes peuvent être renvoyées par n'importe quel endpoint de l'API:

    ### `BadRequest`

      * Signification: Requête invalide.
      * __HTTP Status Code__: [400 Bad Request](https://tools.ietf.org/html/rfc7231#section-6.5.1).

    ### `Unauthorized`

      * Signification: Requête non authentifiée. Les informations d'authentification sont manquantes ou invalides.
      * __HTTP Status Code__: [401 Unauthorized](https://tools.ietf.org/html/rfc7235#section-3.1).

    ### `Forbidden`

      * Signification: Requête authentifiée qui enfreint une règle d'autorisation.
      * __HTTP Status Code__: [403 Forbidden](https://tools.ietf.org/html/rfc7231#section-6.5.3).

    ### `NotFound`

      * Signification: Entité non trouvée.
      * __HTTP Status Code__: [404 Not Found](https://tools.ietf.org/html/rfc7231#section-6.5.4).

    ### `Gone`

      * Signification: Indique que l'entité a existé mais qu'elle a été définitivement supprimée.
      * __HTTP Status Code__: [410 Gone](https://tools.ietf.org/html/rfc7231#section-6.5.9).

    ### `InternalServerError`

      * Signification: Erreur interne du serveur
      * __HTTP Status Code__: [500 Internal Server Error](https://tools.ietf.org/html/rfc7231#section-6.6.1).

    ### `BadGateway`

      * Signification: Le serveur a reçu une réponse invalide du serveur en amont.
      * __HTTP Status Code__: [502 Bad Gateway](https://tools.ietf.org/html/rfc7231#section-6.6.3).

    ### `ServiceUnavailable`

      * Signification: Le service n'est pas disponible actuellement. Le service demandé peut être en cours de maintenance ou en dehors de la fenêtre d'exploitation.
      * __HTTP Status Code__: [503 Service Unavailable](https://tools.ietf.org/html/rfc7231#section-6.6.4).

    ### `GatewayTimeout`

      * Signification: Indique que le service a mis plus de temps que prévu à revenir.
      * __HTTP Status Code__: [504 Gateway Timeout](https://tools.ietf.org/html/rfc7231#section-6.6.5).


    ## Pagination et filtres

    Les endpoints qui retournent des listes de ressources utilisent un format de réponse standardisé pour assurer une expérience cohérente et faciliter la pagination et le filtrage.

    ### Structure de la réponse

    Toutes les listes suivent une structure commune avec deux sections principales :

    ```json
    {
      "data": [...],  // Tableau contenant les éléments de la page actuelle
      "meta": {...}   // Métadonnées sur la pagination et le nombre total d'éléments
    }
    ```

    #### Section `data`
    Contient le tableau des éléments de la page actuelle. Le nombre d'éléments est limité par le paramètre `size`.

    #### Section `meta`
    Contient les informations de pagination et de contexte :

    ```json
    {
      "meta": {
        "total": 100,                              // Nombre total d'éléments (optionnel, si calculé)
        "page": 2,                    // Page actuelle (peut être un entier ou un token)
        "size": 20,                                // Nombre d'éléments par page
        "next": 3,  // Token ou numéro de la page suivante (optionnel)
        "prev": 1   // Token ou numéro de la page précédente (optionnel)
      }
    }
    ```

    **Remarques importantes** :
    - Les champs `page`, `next` et `prev` peuvent être des **nombres entiers** ou des **chaînes de caractères** (tokens)
    - Le champ `total` est optionnel car son calcul peut être coûteux pour de grandes collections
    - Les champs `next` et `prev` sont optionnels et absents s'il n'y a pas de page suivante ou précédente

    ### Paramètres de pagination

    Les paramètres de requête suivants permettent de contrôler la pagination :

    #### Paramètres standards

    - **`page`** : Identifie la page à récupérer
      - Type : `integer` ou `string` (token)
      - Par défaut : `1` (première page)
      - Exemples :
        - Pagination par numéro : `GET /comptes?page=2&size=20`
        - Pagination par token : `GET /comptes?page=eyJrZXkiOiIxMjM0NTY3ODkifQ==&size=20`

    - **`size`** : Nombre d'éléments par page
      - Type : `integer`
      - Valeur minimale : `1`
      - Valeur maximale : `100` (peut varier selon l'endpoint)
      - Par défaut : `20`
      - Exemple : `GET /comptes?page=1&size=50`

    #### Types de pagination

    **Pagination par offset (numérique)** :
    ```
    GET /comptes?page=2&size=20
    ```
    Retourne les éléments 21 à 40 (page 2 × 20 éléments par page).

    **Pagination par curseur (token)** :
    ```
    GET /comptes?page=eyJrZXkiOiIxMjM0NTY3ODkifQ==&size=20
    ```
    Utilise un token opaque pour garantir la cohérence lors de modifications fréquentes des données.

    ### Filtrage des résultats

    Les endpoints de liste supportent le filtrage via des paramètres de requête avec la syntaxe `propriete[operateur]=valeur` :

    **Exemples** :
    ```
    # Filtrer par statut
    GET /paiements-immediats?statut=IRREVOCABLE
    GET /paiements-immediats?statut[ne]=INITIE

    # Filtrer par date de début
    GET /paiements-immediats?dateIrrevocabilite[gte]=2024-01-01

    # Filtrer les demandes de paiement de type PICO (retrait dans le cadre d'un achat)
    GET /demandes-paiements?montantAchat[exists]=true

    # Filtrer les demandes de paiement de type PICASH (retrait simple)
    GET /demandes-paiements?montantAchat[exists]=false&montantRetrait[exists]=true

    # Combiner plusieurs filtres
    GET /paiements-immediats?dateIrrevocabilite[gte]=2024-01-01&statut[ne]=INITIE
    ```

    **Operateurs** :
    - `eq` : égal à
    - `ne` : différent de
    - `gt` : supérieur à
    - `gte` : supérieur ou égal à
    - `lt` : inférieur à
    - `lte` : inférieur ou égal à
    - `in` : dans la liste
    - `contains` : la liste ou la chaine de caractères contient la valeur
    - `notContains` : la liste ou la chaine de caractères ne contient pas la valeur
    - `beginsWith` : commence par la valeur
    - `exists` : existe

    ### Tri des résultats

    Le paramètre `sort` permet de trier les résultats. Pour indiquer l'ordre de tri :

    - **Sans préfixe** : tri ascendant (croissant)
    - **Préfixe `-`** : tri descendant (décroissant)

    **Syntaxe** : `sort=champ` ou `sort=-champ`

    **Exemples** :
    ```
    # Trier par type croissant
    GET /comptes/123456/alias?sort=type

    # Trier par date décroissant
    GET /paiements-immediats?sort=-dateCreation
    ```

    ### Exemples complets

    **Liste simple sans pagination** :
    ```
    GET /comptes/123456/alias
    ```

    **Liste paginée avec taille personnalisée** :
    ```
    GET /paiements-immediats?page=1&size=50
    ```

    **Liste avec filtrage et tri** :
    ```
    GET /paiements-immediats?statut=IRREVOCABLE&sort=-dateCreation&page=1&size=20
    ```

    **Navigation vers la page suivante avec token** :
    ```
    # Première requête
    GET /comptes?page=1&size=20

    # Réponse
    {
      "data": [...],
      "meta": {
        "total": 150,
        "size": 20,
        "page": "1",
        "next": "eyJrZXkiOiIxMjM0NTY3ODkifQ"
      }
    }

    # Requête pour la page suivante
    GET /comptes?page=eyJrZXkiOiIxMjM0NTY3ODkifQ&size=20
    ```


    # Sécurité

    ## Sécurité de l'API

    Les endpoints de l'API Business sont sécurisés de manière robuste, combinant à la fois:
    - le protocole Mutual TLS (MTLS) pour une authentification forte au niveau du transport
    - OAuth2 pour une gestion fine des autorisations.
    Assurant ainsi une sécurité complète de l'accès aux ressources.

