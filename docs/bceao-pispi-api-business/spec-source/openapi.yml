tags:
  - name: Comptes
    description: |
      Le module de gestion des comptes permet aux clients business de gérer leurs comptes à distance et en toute sécurité.

      Il offre trois fonctionnalités principales :

      * **Consulter le solde d'un compte** : Obtenir à tout moment les informations relatives au solde et aux détails d'un compte spécifique.

      * **Lister les opérations** : Afficher l'historique des opérations effectuées sur les comptes (en provenance ou à destination), avec des options de filtrage et de pagination.

      * **Effectuer des transferts intra-comptes** : Initier des transferts de fonds entre les comptes détenus par le même client et domiciliés dans la même institution financière.

  - name: Alias
    description: |
      Un alias de compte est une identification choisie par un client qui lui permet de recevoir des virements sans fournir les informations d’identification de son compte.

      Les alias améliorent l’expérience client en permettant au client d'effectuer des transactions de manière transparente sans avoir besoin de connaître et de saisir les détails de compte bancaire du payé.
      La correspondance entre un alias et un compte client est stockée dans le répertoire des alias centralisé (RAC) de la plateforme PI-SPI.

  - name: Enrôlement
    description: |
      L'enrôlement de l'alias est le processus par lequel une entreprise enregistre et associe un alias — l'adresse de paiement — à chacun de ses clients ou fournisseurs.
      Cet alias devient alors la référence utilisée pour recevoir ou envoyer des paiements, ce qui simplifie la gestion des opérations.

      Pour plus d'informations, veuillez consulter la documentation sur l'enrôlement des alias.

  - name: Participants
    x-displayName: Participants PI
    description: |
      Cet endpoint permet de consulter la liste des participants raccordés à la plateforme PI-SPI.

      Pour chaque participant sont retournés le code membre, le nom, le code banque (uniquement si le participant est une banque)
      et le statut dans PI (`JOIN`, `ENBL`, `DSBL`, `DLTD`).

      Cette liste est notamment utilisée pour identifier le participant destinataire lors d'un paiement
      par numéro de compte via `POST /paiements-envoyes`.

  - name: Notification
    x-displayName: Gestion des webhooks
    description: |
      Les clients business peuvent configurer des webhooks pour recevoir des notifications lorsque des opérations sont effectuées sur leurs comptes.

      Les webhooks sont une technologie utilisée pour établir une communication instantanée entre différents systèmes et plateformes,
      permettant l'échange d'informations et de données en temps réel.

      Dans le contexte de l'API business, les webhooks sont un moyen efficace de tenir les clients informés des mouvements financiers sur leurs comptes sans avoir à vérifier constamment la plateforme (polling).

      Ainsi, lorsqu'un mouvement se produit sur un compte, comme un transfert ou une demande de paiement, le webhook se déclenche et envoie un message automatiquement au système du client, l'informant de l'opération effectuée.

      Ce processus est très utile pour les clients qui ont besoin de suivre leurs comptes en temps réel, notamment les entreprises qui doivent gérer des flux financiers complexes. Il permet également d'**automatiser des actions métier** suite à la réception de notifications. Par exemple :
      - Imprimer automatiquement un reçu lorsqu'un paiement est reçu
      - Déclencher une livraison de produit ou service dès confirmation du paiement
      - Mettre à jour automatiquement le statut d'une commande
      - Envoyer des confirmations par email ou SMS au client final

      De plus, les webhooks sont hautement personnalisables, permettant aux clients de configurer les notifications en fonction de leurs besoins de gestion et de suivi.

