# ***********
# *********** Chemins
# ***********
paths:
  # ***********
  # *********** Gestion des comptes et alias
  # ***********

  /comptes:
    $ref: "./paths/compte/comptes-liste.yml"

  /comptes/{numero}:
    $ref: "./paths/compte/comptes-solde.yml"

  /comptes/transactions:
    $ref: "./paths/compte/comptes-transactions.yml"

  /comptes/{numero}/alias:
    $ref: "./paths/compte/comptes-alias.yml"

  /comptes/{numero}/alias/{cle}:
    $ref: "./paths/compte/comptes-alias-suppression.yml"

  # ***********
  # *********** Enrôlement des alias
  # ***********

  /alias/{cle}:
    $ref: "./paths/enrolement/alias-verification.yml"

  # ***********
  # *********** Référentiel PI - Participants
  # ***********

  /participants:
    $ref: "./paths/participant/participants-liste.yml"

  # ***********
  # *********** Notifications
  # ***********

  /webhooks:
    $ref: "./paths/webhooks/webhooks.yml"

  /webhooks/{id}:
    $ref: "./paths/webhooks/webhooks-details.yml"

  /webhooks/{id}/secrets:
    $ref: "./paths/webhooks/webhooks-secrets.yml"

  # # ***********
  # # *********** Demande de Paiement
  # # ***********

  # Demandes de paiement envoyées
  /demandes-paiements:
    $ref: "./paths/demandes-de-paiement/demandes-paiements.yml"

  /demandes-paiements/{txId}:
    $ref: "./paths/demandes-de-paiement/demandes-paiements-details.yml"

  /demandes-paiements/{txId}/confirmations:
    $ref: "./paths/demandes-de-paiement/demandes-paiements-confirmation.yml"

  # Demandes de paiement reçues
  /demandes-paiements-recues:
    $ref: "./paths/demandes-de-paiement/demandes-paiements-recues.yml"

  /demandes-paiements-recues/{end2endId}:
    $ref: "./paths/demandes-de-paiement/demandes-paiements-recues-details.yml"

  /demandes-paiements-recues/{end2endId}/reponses:
    $ref: "./paths/demandes-de-paiement/demandes-paiements-recues-reponses.yml"

  # Demandes de paiement en masse
  /demandes-paiements-groupes:
    $ref: "./paths/demandes-de-paiement/demandes-paiements-en-masse.yml"

  /demandes-paiements-groupes/{instructionId}:
    $ref: "./paths/demandes-de-paiement/demandes-paiements-en-masse-statut.yml"

  /demandes-paiements-groupes/{instructionId}/confirmations:
    $ref: "./paths/demandes-de-paiement/demandes-paiements-en-masse-confirmations.yml"

  # ***********
  # *********** Paiement immédiats
  # ***********

  # Paiements envoyés
  /paiements-envoyes:
    $ref: "./paths/paiement/paiements-envoyes.yml"

  # Confirmer l'envoie d'un paiement immédiat après recherche d'alias
  /paiements-envoyes/{txId}/confirmations:
    $ref: "./paths/paiement/paiements-confirmations.yml"

  # Détails d'un paiement envoyé
  /paiements-envoyes/{txId}:
    $ref: "./paths/paiement/paiements-envoyes-details.yml"

  # Paiements reçus
  /paiements-recus:
    $ref: "./paths/paiement/paiements-recus.yml"

  /paiements-recus/{txId}:
    $ref: "./paths/paiement/paiements-recus-details.yml"

  # Vérifier la reception d'un paiement à partir de l'end2endId
  /paiements/{end2endId}:
    $ref: "./paths/paiement/paiements-verifications.yml"

  # ***********
  # *********** Paiement en masse
  # ***********
  /paiements-groupes:
    $ref: "./paths/paiement/paiements-en-masse.yml"

  /paiements-groupes/{instructionId}:
    $ref: "./paths/paiement/paiements-en-masse-details.yml"

  /paiements-groupes/{instructionId}/confirmations:
    $ref: "./paths/paiement/paiements-en-masse-confirmations.yml"

  # ***********
  # *********** Retours de fonds
  # ***********
  /paiements/{end2endId}/retours:
    $ref: "./paths/paiement/paiements-retours.yml"

  /paiements/{end2endId}/annulations:
    $ref: "./paths/paiement/paiements-annulation.yml"

  /paiements/{end2endId}/annulations/reponses:
    $ref: "./paths/paiement/paiements-annulation-reponse.yml"

# ***********
# *********** Modèles de données
# ***********
components:
  # SECURITY
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://spi.example.com/oauth/token
          scopes:
            compte_transaction.write: Autorisation d'effectuer des mouvements de fonds entre ses comptes
            compte_transaction.read: Autorisation pour consulter les transactions intra-comptes
            compte.read: Autorisation pour consulter les comptes

            alias.write: Autorisation de créer les alias
            alias.read: Autorisation de consulter les alias
            alias.delete: Autorisation  de supprimer des alias

            enrolement_alias.read: Autorisation pour vérifier l'existence d'un alias

            participant.read: Autorisation de consulter la liste des participants PI

            webhook.read: Autorisation de consulter le webhook
            webhook.write: Autorisation d'écrire sur le webhook
            webhook.delete: Autorisation de supprimer des webhooks

            demande_paiement.write: Autorisation  de créer une demande de paiement
            demande_paiement.read: Autorisation pour consulter des demandes de paiement
            demande_paiement_reponse.write: Autorisation d'accepter ou de rejeter une demande de paiement
            demande_paiement_groupe.write: Autorisation de créer des demandes de paiement en masse
            demande_paiement_groupe.read: Autorisation pour consulter le statut d'une demande de paiement en masse

            paiement.write: Autorisation  de créer un paiement immédiat
            paiement.read: Autorisation pour consulter des paiements immédiats
            paiement_groupe.write: Autorisation de créer des paiements en masse
            paiement_groupe.read: Autorisation pour consulter le statut d'un paiement en masse

            retour_fonds.write: Autorisation d'effectuer des retours de fonds
            demande_annulation.write: Autorisation d'envoyer des demandes d'annulation de paiement
            demande_annulation_reponse.write: Autorisation de répondre aux demandes d'annulation de paiement
