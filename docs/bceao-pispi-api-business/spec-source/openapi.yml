      ## Sécurité des webhooks

      ### Cryptage des données
      Toutes les communications doivent se faire en utilisant une connexion SSL.

      ### Authentification
      Le lien de rappel doit être protégé par un système d'authentification.
      mTLS doit être utilisé pour gérer l'authentification du participant appelant.
      Le certificat mTLS utilisé doit être délivré par une autorité de certification de la BCEAO.

      ### Signature des données
      Pour éviter les modifications indésirables, les événements doivent être signés.
      Cela peut se faire via l'utilisation d'un code d'authentification de message basé sur le hachage (HMAC),
      qui consiste en un algorithme de hachage et un code secret ou une clé que les deux parties partagent.

  - name: DemandesDePaiement
    x-displayName: Demandes de paiement
    description: |
      Une demande de paiement est une demande adressée à une personne ou à une entité pour solliciter le règlement d'un achat, d'un service rendu, d'une dette ou de toute autre obligation financière.

      La demande de paiement indique au payeur identifié par son alias les modalités de réglement.

      Les options de paiement du payeur sont données par `dateLimitePaiement` et `dateLimiteReponse`:
      - la demande de paiement ne peut être acceptée ou rejetée apres _dateLimiteReponse_
      - Lorsque _dateLimiteReponse_ n'est pas renseigné, la valeur par défaut est la date de la demande + 90 jours (3 mois)
      - le date d'échéance du paiement doit être indiquée avec _dateLimitePaiement_
      - Lorsqu'une remise est appliquée, elle reste valide jusqu'à _dateLimitePaiement_

      Lorsqu'un client reçoit une demande de paiement, il peut choisir de:
        1. `Accepter et Payer tout de suite`
        2. `Accepter et Payer plus tard` (Programmer le paiement)
        3. `Refuser`
        4. `Ignorer`

      Lorsque _dateLimiteReponse_ est inférieure à 24h, le paiement ne peut pas être programmé par le payeur.

      Pour les demandes de paiement immédiats sur site, les champs _dateLimitePaiement_ et _dateLimiteReponse_ ne sont pas envoyés.
      La demande expire au plus tard 24h après sa création.

      Pour les demandes de paiement e-commerce et les demandes de paiement de facture, la  _dateLimitePaiement_ doit être renseignée.
      Pour limiter l'exposition des clients aux cas de fraude, la  _dateLimitePaiement_ doit être inférieure à 3 minutes pour les demandes  de paiement e-commerce.

  - name: DemandesDePaiementRecues
    x-displayName: Demandes de paiement recues
    description: |
      Les demandes de paiement recues sont les demandes de paiement reçues par le business.
      Le business peut accepter ou rejeter les demandes de paiement recues.

  - name: DemandesDePaiementEnMasse
    x-displayName: Demandes de paiement en masse
    description: |
      La demande de paiement en masse permet d'envoyer plusieurs demandes de paiement en une seule action.

  - name: PaiementRecu
    x-displayName: Paiements reçus
    description: |
      Cette fonctionnalité permet au business de consulter les paiements reçus.

  - name: PaiementEnvoye
    x-displayName: Paiements envoyés
    description: |
      Cette fonctionnalité permet au business d'effectuer des paiements à destination
      - des clients de type **P** (Personne physique / Particulier),
      - des clients de type **C** (Personne physique commerçante / Commerçant),
      - des clients de type **B** (Entreprise / Business),
      - des clients de type **G** (Entité gouvernementale)

      ### Seuils de paiement

      Les montants maximaux des paiements dépendent du type de client émetteur et du type de client destinataire.
      Tous les montants sont exprimés en **francs CFA (XOF)**.

      #### Montants maximaux par type de transaction

      | Type de transaction | Émetteur | Destinataire | Montant maximum |
      |---------------------|----------|--------------|-----------------|
      | **P2P** | Particulier | Particulier | 5 000 000 XOF |
      | **P2C** | Particulier | Commerçant | 5 000 000 XOF |
      | **P2B** | Particulier | Entreprise | 5 000 000 XOF |
      | **P2G** | Particulier | Gouvernement | 5 000 000 XOF |
      | **C2P** | Commerçant | Particulier | 5 000 000 XOF |
      | **C2C** | Commerçant | Commerçant | 5 000 000 XOF |
      | **C2B** | Commerçant | Entreprise | 5 000 000 XOF |
      | **C2G** | Commerçant | Gouvernement | 5 000 000 XOF |
      | **B2P** | Entreprise | Particulier | 10 000 000 XOF |
      | **B2C** | Entreprise | Commerçant | 10 000 000 XOF |
      | **B2B** | Entreprise | Entreprise | 100 000 000 XOF |
      | **B2G** | Entreprise | Gouvernement | 100 000 000 XOF |
      | **G2P** | Gouvernement | Particulier | 10 000 000 XOF |
      | **G2C** | Gouvernement | Commerçant | 10 000 000 XOF |
      | **G2B** | Gouvernement | Entreprise | 100 000 000 XOF |
      | **G2G** | Gouvernement | Gouvernement | 100 000 000 XOF |

      En tant qu'entreprise, vous pouvez :

      **Envoyer des paiements :**
      - Jusqu'à **10 000 000 XOF** vers les Particuliers (P) et Commerçants (C)
      - Jusqu'à **100 000 000 XOF** vers les Entreprises (B) et entités Gouvernementales (G)

      **Recevoir des paiements :**
      - Jusqu'à **5 000 000 XOF** de la part des Particuliers (P) et Commerçants (C)
      - Jusqu'à **100 000 000 XOF** de la part des Entreprises (B) et entités Gouvernementales (G)

  - name: PaiementVerification
    x-displayName: Vérification des paiements
    description: |
      Cette fonctionnalité permet au business de vérifier le statut d'un paiement à partir du txId ou du end2endId.

  - name: PaiementEnMasse
    x-displayName: Paiements en masse
    description: |
      Un paiement en masse est un ensemble de paiements qui sont liés entre eux par un identifiant unique (instructionId).
      Le paiement en masse peut être relancé en cas d'échec de paiement.

      **Taille maximale d'une transaction**:
      La taille maximale d'une transaction a été estimée en considérant **la longueur maximale de chaque champ** (`txId`, `payeAlias`, `montant`, `motif`, `refDocNumero`, `refDocType`).
      - Taille maximale par transaction : ~310 octets
        - `txId` : 35 caractères
        - `payeAlias` : 36 caractères
        - `montant` : 10 caractères pour 1 milliard
        - `motif` : 140 caractères
        - `refDocNumero` : 35 caractères
        - `refDocType` : 4 caractères
        - JSON overhead : ~50 octets

      **Exemples**:
      | Nombre de transactions | Taille JSON approximative |
      |------------------------|--------------------------|
      | 1 000 | ~0,31 MB |
      | 5 000 | ~1,55 MB |
      | 10 000 | ~3,1 MB |

      **Enjeux à prendre en compte**:
      - Performance du serveur : plus le lot est volumineux, plus le traitement peut être long.
      - Timeout HTTP : des lots très gros peuvent provoquer des erreurs côté client ou serveur.
      - Risque d’échec partiel : en cas de problème réseau ou serveur, un lot très gros est plus difficile à relancer.
      - Recommandation pratique : les lots de 500 à 5 000 transactions restent faciles à gérer. Pour des volumes supérieurs, découper le paiement en plusieurs sous-lots.

  - name: RetoursdeFonds
    x-displayName: Retours de fonds
    description: |
      L'opération de retour de fonds est initiée par le client payé pour retourner les fonds d'un paiement reçu.
      Le payé peut retourner les fonds jusqu'à 90 jours après la date de paiement.
      Après 90 jours, le retour de fonds ne peut plus être effectué.

  - name: DemandeAnnulation
    x-displayName: Demandes d'annulation
    description: |
      La demande d'annulation est une opération initiée par le client payeur pour solliciter le retour des fonds d'un paiement envoyé.

      Tant que le payé n'a pas retourné les fonds, le payeur peut demander l'annulation du paiement.
      Par exemple lorsque le payeur demande une deuxième fois l'annulation du paiement, une nouvelle demande d'annulation sera envoyée au payé.

      Le payeur peut demander l'annulation du paiement jusqu'à 90 jours après la date de paiement.
      Après 90 jours, la demande d'annulation ne peut plus être effectuée.

