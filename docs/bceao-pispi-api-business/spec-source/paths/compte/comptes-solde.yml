parameters:
  - name: numero
    in: path
    description: Le numéro de compte sur lequel porte la demande
    required: true
    schema:
      type: string

# Recuperer detail compte
get:
  tags:
    - Comptes
  summary: Détails d'un compte
  description: |
    Cet endpoint permet au client de consulter à tout moment les informations détaillées relatives à un compte spécifique.

    Les informations retournées incluent :
    - Le type de compte (compte courant, épargne, etc.)
    - Le numéro du compte
    - La date d'ouverture du compte
    - Le solde actuel du compte
    - Le statut du compte (ouvert, bloqué ou clôturé)
    - L'indicateur de pré-confirmation pour les opérations

    Cette consultation permet au client business de surveiller l'état de ses comptes en temps réel et de prendre des décisions éclairées concernant ses opérations financières.
  security:
    - OAuth2: [compte.read]
  operationId: compteSoldeConsulter
  responses:
    "200":
      description: Succès de l'opération
      content:
        application/json:
          schema:
            $ref: "../../schemas/compte/CompteSolde.yml"
          examples:
            "solde-compte":
              $ref: "../../examples/compte/CompteSolde.yml"
    "401":
      $ref: "../../responses/commons/AutorisationsManquantes.yml"
    "404":
      $ref: "../../responses/commons/RessourceInexistant.yml"
    "429":
      $ref: "../../responses/commons/LimiteUtilisationDepasse.yml"
    "503":
      $ref: "../../responses/commons/ProblemeServeur.yml"
