# Transfert intra comptes
post:
  tags:
    - Comptes
  summary: Transfert intra-comptes
  operationId: compteTransfertIntraCreer
  security:
    - OAuth2: [compte_transaction.write]
  description: |
    Le transfert intra-comptes est un transfert de fonds entre deux comptes détenus par la même entité juridique et domiciliés au sein de la même institution financière. Le compte source (débiteur/payeur) et le compte destination (créditeur/bénéficiaire) appartiennent donc au même client.

  requestBody:
    description: |
      Le client business peut effectuer un transfert intra-comptes en utilisant les numéros de compte.
    content:
      application/json:
        schema:
          $ref: "../../schemas/compte/CompteTransfertIntraRequest.yml"
        examples:
          transfert-intra:
            $ref: "../../examples/compte/CompteTransfertRequestNumero.yml"
    required: true
  responses:
    "200":
      description: Transfert effectué avec succès.
      content:
        application/json:
          schema:
            $ref: "../../schemas/compte/CompteTransfertIntraReponse.yml"
          examples:
            transfert-success-reponse:
              $ref: "../../examples/compte/CompteTransfertReponseInitie.yml"
            transfert-irrevocable-reponse:
              $ref: "../../examples/compte/CompteTransfertReponseIrrevocable.yml"
            transfert-rejete-reponse:
              $ref: "../../examples/compte/CompteTransfertReponseRejete.yml"
    "403":
      description: Interdiction d'effectuer le paiement
      content:
        application/problem+json:
          schema:
            $ref: "../../schemas/commons/Problem7807.yml"
          examples:
            transfert-solde-insuffisant:
              $ref: "../../examples/compte/CompteTransfertReponseSoldeInsuffisant.yml"
            transfert-paye-bloque:
              $ref: "../../examples/compte/CompteTransfertReponsePayeBloque.yml"
    "409":
      description: Identifiant de transaction (txId) déjà utilisé avec des données différentes.
      content:
        application/problem+json:
          schema:
            $ref: "../../schemas/commons/Problem7807.yml"
    "400":
      $ref: "../../responses/commons/FormatInvalide.yml"
    "401":
      $ref: "../../responses/commons/AutorisationsManquantes.yml"
    "429":
      $ref: "../../responses/commons/LimiteUtilisationDepasse.yml"
    "503":
      $ref: "../../responses/commons/ProblemeServeur.yml"

# Lister les comptes
get:
  tags:
    - Comptes
  summary: Lister les transferts intra-comptes
  description: |
    Endpoint pour la consultation des transferts entre ses differents comptes chez le participant.
  operationId: compteTransfertIntraLister
  security:
    - OAuth2: [compte_transaction.read]

  parameters:
    - name: txId
      in: query
      schema:
        type: string
        title: Identifiant de la transaction
        description: Filtre les opérations selon l'identifiant de la transaction
    - name: statut
      in: query
      schema:
        type: string
        title: Statut du compte
        description: Filtre les opérations selon le statut de ceux-ci
    - name: payeurNumero
      in: query
      schema:
        type: string
        title: Compte payeur
        description: Filtre les opérations selon le numéro de compte du payeur
    - name: payeNumero
      in: query
      schema:
        type: string
        title: Compte payé
        description: Filtre les opérations selon le numéro de compte du payé
    - name: dateEnvoi
      in: query
      schema:
        type: string
        format: date-time
        title: Date d'envoi
        description: Filtre les opérations selon la date d'envoi
    - name: dateIrrevocabilite
      in: query
      schema:
        type: string
        format: date-time
        title: Date d'irrévocabilité
        description: Filtre les opérations selon la date d'irrévocabilité
    - name: motif
      in: query
      schema:
        type: string
        title: Motif
        description: Filtre les opérations selon le motif

    # Pagination
    - name: page
      in: query
      schema:
        type: string
        title: Page
        description: Identifiant de la page
    - name: size
      in: query
      schema:
        type: string
        title: Taille de la page
        description: Nombre d'éléments à retourner
    - name: sort
      in: query
      schema:
        type: string
        title: Triage
        description: Trie les éléments selon le champ spécifié
    # Liste de champs à retourner
    - $ref: "../../parameters/Champs.yml"

  responses:
    "200":
      description: Succès de l'opération
      content:
        application/json:
          schema:
            $ref: "../../schemas/compte/CompteOperationListe.yml"
          examples:
            transfert-liste-reponse:
              $ref: "../../examples/compte/CompteTransfertListeReponse.yml"
    "401":
      $ref: "../../responses/commons/AutorisationsManquantes.yml"
    "429":
      $ref: "../../responses/commons/LimiteUtilisationDepasse.yml"
    "503":
      $ref: "../../responses/commons/ProblemeServeur.yml"
