parameters:
  - name: txId
    in: path
    description: L'identifiant de la transaction dans le SI du client business
    required: true
    schema:
      type: string

# verifier le statut de la demande de paiement
get:
  tags:
    - DemandesDePaiement
  summary: Consulter une demande
  security:
    - OAuth2: [demande_paiement.read]
  description: |
    Cet point de terminaison permet de consulter les details d'une demande de paiement envoyée.
  operationId: demandePaiementRecuperer
  responses:
    "200":
      description: Opération effectuée avec succès
      content:
        application/json:
          schema:
            $ref: "../../schemas/demandes-de-paiement/DemandePaiementConsultationReponse.yml"
          examples:
            demande-envoyee:
              $ref: "../../examples/demandes-de-paiement/DemandePaiementReponseCasSansConfirmation.yml"
            demande-attente:
              $ref: "../../examples/demandes-de-paiement/DemandePaiementReponseCasAvecConfirmation.yml"

            demande-acceptee:
              $ref: "../../examples/demandes-de-paiement/DemandePaiementReponseAcceptation.yml"
            demande-rejetee-demandeur-inconnu:
              $ref: "../../examples/demandes-de-paiement/DemandePaiementReponseRejetDemandeurInconnu.yml"

    "401":
      $ref: "../../responses/commons/AutorisationsManquantes.yml"
    "404":
      $ref: "../../responses/commons/RessourceInexistant.yml"
    "429":
      $ref: "../../responses/commons/LimiteUtilisationDepasse.yml"
    "503":
      $ref: "../../responses/commons/ProblemeServeur.yml"
