parameters:
  - name: end2endId
    in: path
    description: L'identifiant de la demande de paiement reçue
    required: true
    schema:
      type: string

# verifier le statut de la demande de paiement
get:
  tags:
    - DemandesDePaiementRecues
  summary: Consulter une demande reçue
  security:
    - OAuth2: [demande_paiement.read]
  description: |
    Cet point de terminaison permet de consulter les details d'une demande de paiement reçue.
  operationId: demandePaiementRecueRecuperer
  responses:
    "200":
      description: Opération effectuée avec succès
      content:
        application/json:
          schema:
            $ref: "../../schemas/demandes-de-paiement/DemandePaiementConsultationReponse.yml"
          examples:
            demande-recue-en-attente:
              $ref: "../../examples/demandes-de-paiement/DemandePaiementRecueEnAttente.yml"
            demande-recue-acceptee:
              $ref: "../../examples/demandes-de-paiement/DemandePaiementRecueAcceptee.yml"
            demande-recue-rejetee:
              $ref: "../../examples/demandes-de-paiement/DemandePaiementRecueRejetee.yml"

    "401":
      $ref: "../../responses/commons/AutorisationsManquantes.yml"
    "404":
      $ref: "../../responses/commons/RessourceInexistant.yml"
    "429":
      $ref: "../../responses/commons/LimiteUtilisationDepasse.yml"
    "503":
      $ref: "../../responses/commons/ProblemeServeur.yml"
