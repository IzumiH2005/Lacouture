# Lister les demandes de paiement recues
get:
  parameters:
    # Statut
    - name: statut
      in: query
      schema:
        type: string
        enum: ["INITIE", "IRREVOCABLE", "REJETE"]
        title: Statut de la demande de paiement

    # Categorie
    - name: categorie
      in: query
      schema:
        type: string
        title: Categorie de la demande
        enum: ["631", "500", "521", "401"]

    # Payeur Alias
    - name: payeurAlias
      in: query
      schema:
        type: string
        title: alias du compte qui a reçu la demande de paiement

    # Payeur Compte
    - name: payeurCompte
      in: query
      schema:
        type: string
        title: numéro de compte qui a reçu la demande de paiement

    # Destinataire
    - name: payeAlias
      in: query
      schema:
        type: string
        title: alias du client payé qui a envoyé la demande de paiement

    # Date demande de paiement
    - in: query
      name: dateDemande
      required: false
      schema:
        type: string
        format: date-time
        title: Date de la demande de paiement

    # Date Limite paiement
    - in: query
      name: dateLimitePaiement
      required: false
      schema:
        type: string
        format: date-time
        title: Date limite de paiement

    # Remise
    - name: remise
      in: query
      schema:
        type: boolean
        title: Remise
        description: >-
          Recherche les transactions avec ou sans remise.

    # Motif
    - name: motif
      in: query
      schema:
        type: string
        title: Motif de la demande de paiement
        description: >-
          Recherche les enregistrements en fonction du motif de la demande de paiement.

    # Ref Doc Type
    - name: refDocType
      in: query
      schema:
        type: string
        title: Type de document justificatif
        description: Recherche les enregistrements en fonction du type de document justificatif.

    # Pagination
    - name: page
      in: query
      schema:
        type: string
        title: Page
        description: Identifiant de la page
    - name: size
      in: query
      schema:
        type: number
        title: Taille de la page
        description: Nombre d'éléments à retourner
    - name: sort
      in: query
      schema:
        type: string
        title: Triage
        description: Trie les éléments selon le champ spécifié

    # Liste de champs à retourner
    - $ref: "../../parameters/Champs.yml"

  tags:
    - DemandesDePaiementRecues
  summary: Lister les demandes reçues
  security:
    - OAuth2: [demande_paiement.read]
  description: Ce point de terminaison permet de lister les demandes de paiements reçues par l'entreprise.
  operationId: demandePaiementRecueLister
  responses:
    "200":
      description: Succès de l'opération
      content:
        application/json:
          schema:
            $ref: "../../schemas/demandes-de-paiement/DemandePaiementListe.yml"
          examples:
            liste-demandes:
              $ref: "../../examples/demandes-de-paiement/DemandePaiementRecuesListe.yml"
    "401":
      $ref: "../../responses/commons/AutorisationsManquantes.yml"
    "429":
      $ref: "../../responses/commons/LimiteUtilisationDepasse.yml"
    "503":
      $ref: "../../responses/commons/ProblemeServeur.yml"
