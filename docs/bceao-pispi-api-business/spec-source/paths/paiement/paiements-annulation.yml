# path => /paiements/{end2endId}/annulations
# Demande d'annulation de paiement
parameters:
  - name: end2endId
    in: path
    description: L'identifiant unique de bout en bout de la transaction
    required: true
    schema:
      type: string
post:
  tags:
    - DemandeAnnulation
  summary: Demander l'annulation d'un paiement
  security:
    - OAuth2: [demande_annulation.write]
  description: |
    Ce point de terminaison permet de demander l'annulation d'un paiement envoyé.

    À l'acceptation de la demande d'annulation, le payé effectue un retour de fonds et le business recevra une notification `RETOUR_RECU` s'il a souscrit au service de webhook.

    Si le payé refuse la demande d'annulation, le business recevra une notification `ANNULATION_REJETE`.

    **Note importante sur l'idempotence :**

    Cet endpoint utilise **POST (pas PUT)** car chaque appel envoie une **nouvelle demande d'annulation** au PSP bénéficiaire. 

    **Comportement :**
    - Premier appel → Nouvelle demande d'annulation envoyée
    - Deuxième appel → **Nouvelle demande d'annulation envoyée** (pas idempotent)
    - Troisième appel → **Nouvelle demande d'annulation envoyée**

    **Cas d'usage :**
    - La première demande a été refusée, vous réessayez
    - Vous voulez relancer une demande en attente
    - Vous avez de nouvelles informations justifiant l'annulation

  operationId: demandeAnnulationEnvoyer
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../../schemas/paiement/PaiementAnnulationRequest.yml"
        examples:
          erreur-destinataire:
            $ref: "../../examples/paiement/PaiementAnnulationRequest.yml"
    required: true
  responses:
    "200":
      description: Demande d'annulation envoyée
      content:
        application/json:
          schema:
            $ref: "../../schemas/paiement/Paiement.yml"
          examples:
            envoye:
              $ref: "../../examples/paiement/PaiementAnnulationReponseEnvoye.yml"
    "404":
      description: Paiement non trouvé
      content:
        application/problem+json:
          schema:
            $ref: "../../schemas/commons/Problem7807.yml"
          examples:
            paiement-inexistant:
              summary: "Paiement inexistant ou déjà archivé"
              value:
                type: "about:blank"
                title: "Not Found"
                status: 404
                detail: "Paiement inexistant ou déjà archivé"
                invalid-params:
                  - name: end2endId
                    reason: Le paiement avec cet identifiant n'existe pas ou a déjà été archivé
    "403":
      description: Interdiction d'effectuer la demande d'annulation
      content:
        application/problem+json:
          schema:
            $ref: "../../schemas/commons/Problem7807.yml"
          examples:
            delai-depasse:
              summary: "Délai de demande d'annulation dépassé"
              value:
                type: "about:blank"
                title: "Bad Request"
                status: 403
                detail: "Délai de demande d'annulation dépassé"
                invalid-params:
                  - name: end2endId
                    reason: Une demande d'annulation d'un paiement ne peut être effectuée plus de 90 jours après la date de paiement
            # Retour déjà effectuée
            retour-de-fonds-deja-effectue:
              summary: "Retour de fonds déjà effectué"
              value:
                type: "about:blank"
                title: "Bad Request"
                status: 403
                detail: "Retour de fonds déjà effectué"
                invalid-params:
                  - name: end2endId
                    reason: Le retour de fonds a déjà été effectué pour cette transaction

            # Transaction non irrévocable
            transaction-non-irrevocable:
              summary: "Transaction non irrévocable"
              value:
                type: "about:blank"
                title: "Bad Request"
                status: 403
                detail: "Transaction non irrévocable"
                invalid-params:
                  - name: end2endId
                    reason: L'annulation ne peut pas être demandée pour un transfert qui n'est pas irrévocable

    "401":
      $ref: "../../responses/commons/AutorisationsManquantes.yml"
    "429":
      $ref: "../../responses/commons/LimiteUtilisationDepasse.yml"
    "503":
      $ref: "../../responses/commons/ProblemeServeur.yml"
