# Confirmer l'envoi d'un paiement après recherche d'alias
# /paiements-envoyes/{txId}/confirmations:
parameters:
  - name: txId
    in: path
    description: L'identifiant de la transaction dans le SI du payé
    required: true
    schema:
      type: string
put:
  tags:
    - PaiementEnvoye
  summary: Confirmer le paiement
  security:
    - OAuth2: [paiement.write]
  description: |
    Ce point de terminaison permet d'envoyer la confirmation de l'envoi d'un paiement
    après vérification du nom et du pays du bénéficiaire.

    **Idempotence** : Cet endpoint est idempotent.
    - Premier appel avec `decision: true` → Lance le paiement, retourne `200 OK {statut: "ENVOYE"}`
    - Appels suivants avec `decision: true` → Retourne `200 OK` avec l'état actuel (ENVOYE, IRREVOCABLE, ou REJETE) - idempotent
    - Premier appel avec `decision: false` → Annule, retourne `200 OK {statut: "ANNULE"}`
    - Appels suivants avec `decision: false` → Retourne `200 OK {statut: "ANNULE"}` (idempotent)
    - `decision: true` après `decision: false` → Retourne `403 Forbidden` (déjà annulé)
    - `decision: false` après `decision: true` → Retourne `403 Forbidden` (déjà confirmé)

    **Timeout** : La confirmation doit être envoyée dans les **24 heures** suivant la création de la demande. Passé ce délai, la demande expire automatiquement et ne peut plus être confirmée.

    **Changement de décision** : Une fois une décision prise, elle est définitive. Impossible de confirmer après avoir annulé, et vice-versa.
  operationId: paiementConfirmer
  requestBody:
    description: Le client envoie oui ou non s'il confirme l'envoi du paiement.
    content:
      application/json:
        schema:
          $ref: "../../schemas/paiement/PaiementImmediatConfirmationRequest.yml"
        examples:
          confirme:
            $ref: "../../examples/paiement/PaiementImmediatConfirmationRequeteCasConfirmationOui.yml"
          annule:
            $ref: "../../examples/paiement/PaiementImmediatConfirmationRequeteCasConfirmationNon.yml"
    required: true
  responses:
    "200":
      description: Paiement en cours d'envoi
      content:
        application/json:
          schema:
            $ref: "../../schemas/paiement/PaiementImmediatConfirmationReponse.yml"
          examples:
            confirmation-oui:
              $ref: "../../examples/paiement/PaiementImmediatConfirmationReponseCasOui.yml"
            confirmation-non:
              $ref: "../../examples/paiement/PaiementImmediatConfirmationReponseCasNon.yml"

    "403":
      description: Opération interdite
      content:
        application/problem+json:
          schema:
            $ref: "../../schemas/commons/Problem7807.yml"
          examples:
            decision-true-apres-false:
              summary: "Tentative de confirmation après annulation"
              value:
                type: "about:blank"
                title: "Forbidden"
                status: 403
                detail: "Impossible de confirmer un paiement déjà annulé"
            decision-false-apres-true:
              summary: "Tentative d'annulation après confirmation"
              value:
                type: "about:blank"
                title: "Forbidden"
                status: 403
                detail: "Impossible d'annuler un paiement déjà confirmé"
            timeout-depasse:
              summary: "Délai de confirmation dépassé"
              value:
                type: "about:blank"
                title: "Forbidden"
                status: 403
                detail: "Le délai de confirmation de 24 heures a été dépassé"
    "401":
      $ref: "../../responses/commons/AutorisationsManquantes.yml"
    "404":
      $ref: "../../responses/commons/RessourceInexistant.yml"
    "429":
      $ref: "../../responses/commons/LimiteUtilisationDepasse.yml"
    "503":
      $ref: "../../responses/commons/ProblemeServeur.yml"
