# path => /paiements/{end2endId}/retours
# Retourner les fonds
parameters:
  - name: end2endId
    in: path
    description: L'identifiant unique de bout en bout de la transaction
    required: true
    schema:
      type: string
put:
  tags:
    - RetoursdeFonds
  summary: Retourner les fonds
  security:
    - OAuth2: [retour_fonds.write]
  description: |
    Ce point de terminaison permet au business de retourner les fonds d'un paiement reçu.

    **Idempotence** : Cet endpoint est idempotent. Plusieurs appels avec le même `end2endId` produiront le même résultat.
    Si le retour de fonds a déjà été envoyé et irrévocable, le champ `retourStatut` de la réponse sera `IRREVOCABLE`.
    Si le retour de fonds a été envoyé et rejeté, le retour de fonds sera envoyé à nouveau.
    Si le retour de fonds est en cours d'envoi, le champ `retourStatut` de la réponse sera `INITIE`.

    **Notifications webhook** : Après envoi du retour de fonds, si le business a souscrit au service de webhook, il recevra :
    - Une notification `RETOUR_ENVOYE` en cas de succès du retour de fonds
    - Une notification `RETOUR_REJETE` en cas de rejet de la demande

    **Vérification du statut** : Pour obtenir le statut d'un retour de fonds envoyé, vous pouvez invoquer l'endpoint `GET /paiements/{end2endId}` et le champ `retourStatut` de la réponse indiquera l'état du retour de fonds.

  operationId: retourFondsEnvoyer
  responses:
    "200":
      description: Retour de fonds enregistré avec succès
      content:
        application/json:
          schema:
            $ref: "../../schemas/paiement/Paiement.yml"
          examples:
            initie:
              $ref: "../../examples/paiement/PaiementRetourReponseInitie.yml"
            deja-envoye:
              $ref: "../../examples/paiement/PaiementRetourReponseIrrevocable.yml"

    "404":
      description: Paiement non trouvé
      content:
        application/problem+json:
          schema:
            $ref: "../../schemas/commons/Problem7807.yml"
          examples:
            paiement-inexistant:
              summary: "Paiement inexistant ou déjà archivé"
              value:
                type: "about:blank"
                title: "Not Found"
                status: 404
                detail: "Paiement inexistant ou déjà archivé"
                invalid-params:
                  - name: end2endId
                    reason: Le paiement avec cet identifiant n'existe pas ou a déjà été archivé
    "403":
      description: Interdiction d'effectuer le retour de fonds
      content:
        application/problem+json:
          schema:
            $ref: "../../schemas/commons/Problem7807.yml"
          examples:
            paiement-inexistant:
              summary: "Délai de retour de fonds dépassé"
              value:
                type: "about:blank"
                title: "Bad Request"
                status: 403
                detail: "Délai de retour de fonds dépassé"
                invalid-params:
                  - name: end2endId
                    reason: Un paiement ne peut être retourné plus de 90 jours après la date de paiement
    "401":
      $ref: "../../responses/commons/AutorisationsManquantes.yml"
    "429":
      $ref: "../../responses/commons/LimiteUtilisationDepasse.yml"
    "503":
      $ref: "../../responses/commons/ProblemeServeur.yml"
