# Lister les participants PI
get:
  tags:
    - Participants
  summary: Lister les participants PI
  description: |
    Cet endpoint permet au client business de consulter la liste des participants raccordés à PI-SPI.

    Cette liste est notamment utilisée pour identifier le participant destinataire
    lors d'un paiement par numéro de compte via `POST /paiements-envoyes`.
  security:
    - OAuth2: [participant.read]
  operationId: participantsLister
  responses:
    "200":
      description: Succès de l'opération
      content:
        application/json:
          schema:
            $ref: "../../schemas/participant/ParticipantListe.yml"
          examples:
            liste-participants:
              $ref: "../../examples/participant/ParticipantListe.yml"
    "401":
      $ref: "../../responses/commons/AutorisationsManquantes.yml"
    "429":
      $ref: "../../responses/commons/LimiteUtilisationDepasse.yml"
    "503":
      $ref: "../../responses/commons/ProblemeServeur.yml"
