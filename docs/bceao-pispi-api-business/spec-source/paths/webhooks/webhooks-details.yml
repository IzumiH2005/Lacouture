parameters:
  - name: id
    in: "path"
    required: true
    schema:
      type: "string"
      title: Identifiant du webhook

# modifier un webhook
put:
  tags:
    - Notification
  summary: Modifier un Webhook
  operationId: webhookModifier
  security:
    - OAuth2: [webhook.write]
  description: |
    Endpoint pour la modification d'un webhook.
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../../schemas/webhooks/WebhookModificationRequest.yml"
        examples:
          modification-callback-url:
            $ref: "../../examples/webhooks/NotificationModificationWebhookCallbackUrl.yml"
          modification-alias:
            $ref: "../../examples/webhooks/NotificationModificationWebhookAlias.yml"
          modification-events:
            $ref: "../../examples/webhooks/NotificationModificationWebhookEvents.yml"
    required: true
  responses:
    "200":
      description: "Le Webhook a été modifié avec succès"
      content:
        "application/json":
          schema:
            $ref: "../../schemas/webhooks/WebhookData.yml"
          examples:
            notification-paiement-recu:
              $ref: "../../examples/webhooks/NotificationModificationReponsePaiementRecu.yml"
    "401":
      $ref: "../../responses/commons/AutorisationsManquantes.yml"
    "429":
      $ref: "../../responses/commons/LimiteUtilisationDepasse.yml"
    "503":
      $ref: "../../responses/commons/ProblemeServeur.yml"

# Supprimer un webhook
delete:
  tags:
    - Notification
  summary: Supprimer un Webhook
  operationId: webhookSupprimer
  security:
    - OAuth2: [webhook.delete]
  description: |
    Endpoint pour la suppression d'un webhook.

  responses:
    "204":
      description: "Le Webhook  a été supprimé."
    "401":
      $ref: "../../responses/commons/AutorisationsManquantes.yml"
    "429":
      $ref: "../../responses/commons/LimiteUtilisationDepasse.yml"
    "503":
      $ref: "../../responses/commons/ProblemeServeur.yml"

# Recuperer un webhook
get:
  tags:
    - Notification
  summary: Recuperer un webhook
  operationId: webhookConsulter
  security:
    - OAuth2: [webhook.read]
  description: Endpoint pour la consultation des informations d'un Webhook
  responses:
    "200":
      description: Details du webhook
      content:
        "application/json":
          schema:
            $ref: "../../schemas/webhooks/WebhookData.yml"
    "401":
      $ref: "../../responses/commons/AutorisationsManquantes.yml"
    "429":
      $ref: "../../responses/commons/LimiteUtilisationDepasse.yml"
    "503":
      $ref: "../../responses/commons/ProblemeServeur.yml"
