parameters:
  - name: id
    in: "path"
    required: true
    schema:
      type: "string"
      title: Identifiant du webhook

# Créer un webhook
post:
  tags:
    - Notification
  summary: Renouveler le secret d'un webhook
  security:
    - OAuth2: [webhook.write]
  operationId: webhookSecretCreer
  description: |
    Cet endpoint permet au business de renouveler le secret d'un webhook.

    Le secret est utilisé pour signer les notifications envoyées par le participant.

    Lors de la demande de renouvellement, le business doit préciser la date d'expiration du secret.
    A cette date, le secret actuel du webhook sera invalidé et le nouveau secret sera utilisé.
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../../schemas/webhooks/WebhookRenouvellementSecretRequest.yml"
    required: true
  responses:
    "200":
      description: Secret renouvellé avec succès
      content:
        application/json:
          schema:
            $ref: "../../schemas/webhooks/WebhookCreationResponse.yml"
          examples:
            notification-paiement-recu:
              $ref: "../../examples/webhooks/NotificationCreationWebhookReponsePaiementRecu.yml"
    "401":
      $ref: "../../responses/commons/AutorisationsManquantes.yml"
    "400":
      $ref: "../../responses/commons/FormatInvalide.yml"
    "429":
      $ref: "../../responses/commons/LimiteUtilisationDepasse.yml"
    "503":
      $ref: "../../responses/commons/ProblemeServeur.yml"
