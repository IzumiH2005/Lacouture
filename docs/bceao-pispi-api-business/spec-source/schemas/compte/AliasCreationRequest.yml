type: object
properties:
  type:
    type: string
    enum:
      - MCOD
      - SHID
    description: |
      Le client doit spécifier le type d'alias qu'il souhaite créer.
      Les types d'alias disponibles sont :
      - MCOD: Identifiant de compte marchand pour le service USSD uniquement
      - SHID: Adresse de paiement
additionalProperties: false
required:
  - type
