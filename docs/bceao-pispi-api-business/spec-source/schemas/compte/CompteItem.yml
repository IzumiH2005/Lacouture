# Modèle Compte pour la liste (sans solde ni agence)
type: object
properties:
  numero:
    type: string
    description: Le numéro de compte
  type:
    type: string
    enum:
      [
        "CACC",
        "CARD",
        "CASH",
        "CHAR",
        "CISH",
        "COMM",
        "CPAC",
        "LLSV",
        "LOAN",
        "MGLD",
        "MOMA",
        "NREX",
        "ODFT",
        "ONDP",
        "OTHR",
        "SACC",
        "SLRY",
        "SVGS",
        "TAXE",
        "TRAN",
        "TRAS",
        "VACC",
      ]
    description: |
      Le type du compte. Codes possibles :
      - **CACC** : Compte courant utilisé pour enregistrer les débits et crédits lorsqu'aucun compte spécifique n'a été désigné
      - **CARD** : Compte de carte utilisé pour les paiements par carte de crédit
      - **CASH** : Compte de paiement en espèces utilisé pour le paiement d'espèces
      - **CHAR** : Compte de frais utilisé pour les frais si différent du compte de paiement
      - **CISH** : Compte de revenus en espèces utilisé pour le paiement de revenus si différent du compte de trésorerie courant
      - **COMM** : Compte de commission utilisé pour les commissions si différent du compte de paiement
      - **CPAC** : Compte de règlement du participant de compensation utilisé pour enregistrer les entrées de débit et crédit de règlement au nom d'un participant de compensation désigné
      - **LLSV** : Compte d'épargne à liquidité limitée utilisé pour l'épargne avec des conditions d'intérêt et de retrait spéciales
      - **LOAN** : Compte de prêt utilisé pour les prêts
      - **MGLD** : Compte de prêt marginal utilisé pour une facilité de prêt marginal
      - **MOMA** : Compte de marché monétaire utilisé pour les marchés monétaires si différent du compte de trésorerie
      - **NFCA** : Compte en devises étrangères pour non-résidents détenu localement par un individu ou une entité non-résidente
      - **NREX** : Compte externe pour non-résidents utilisé pour les non-résidents externes
      - **ODFT** : Compte de découvert utilisé pour les découverts
      - **ONDP** : Compte de dépôt à vue utilisé pour les dépôts à vue
      - **OTHR** : Autre type de compte non spécifié ailleurs
      - **SACC** : Compte de règlement utilisé pour enregistrer les entrées de débit et crédit résultant de transactions compensées et réglées via un système de compensation et de règlement spécifique
      - **SLRY** : Compte de salaire utilisé pour les paiements de salaires
      - **SVGS** : Compte d'épargne utilisé pour l'épargne
      - **TAXE** : Compte de taxes utilisé pour les taxes si différent du compte de paiement
      - **TRAN** : Compte de transaction, type de compte bancaire le plus basique, généralement sans carnet de chèques ni facilité de découvert
      - **TRAS** : Compte de trading en espèces utilisé pour le trading si différent du compte de trésorerie courant
      - **VACC** : Compte virtuel créé virtuellement pour faciliter la collecte et la réconciliation
  dateOuverture:
    type: string
    format: date
    description: La date d'ouverture du compte au format YYYY-MM-DD
    example: "2023-02-21"
  statut:
    type: string
    enum: ["OUVERT", "BLOQUE", "CLOTURE"]
    description: |
      Le statut actuel du compte.
      - **OUVERT** : Le compte est actif et opérationnel
      - **BLOQUE** : Le compte est temporairement bloqué
      - **CLOTURE** : Le compte est fermé définitivement
additionalProperties: false
