type: object
properties:
  txId:
    type: string
    description: Identifiant de la transaction dans le SI du client
  montant:
    type: number
    description: Le montant du transfert à effectuer.
  motif:
    type: string
    description: Le motif du transfert
  payeurNumero:
    type: string
    description: Le numéro de compte du payeur. Requis si `payeurAlias` n'est pas fourni.
  payeNumero:
    type: string
    description: Le numéro de compte du payé. Requis si `payeAlias` n'est pas fourni.
  statut:
    type: string
    enum:
      - INITIE
      - IRREVOCABLE
      - REJETE
    description: |
      - `INITIE` Le transfert est en cours de traitement
      - `IRREVOCABLE` Le tranfert à été effectué avec succès
      - `REJETE` Le tranfert à été rejeté
  statutRaison:
    type: string
    enum:
      - SOLDE_INSUFFISANT
    description: |
      Raisons du rejet d'un tranfert':
      - SOLDE_INSUFFISANT le solde du compte debiteur est insuffisant pour effectuer l'opération.
      - COMPTE_BLOQUE le compte debiteur ou le compte crediteur est bloqué
      - COMPTE_CLOTURE le compte debiteur ou le compte crediteur est cloturé
  dateEnvoi:
    type: string
    format: date-time
    description: |
      Date d'envoi du transfert de fonds: date et heure à laquelle le transfert à été initié
  dateIrrevocabilite:
    type: string
    format: date-time
    description: |
      Date d'irrévocabilité du transfert de fonds: date et heure à laquelle le transfert à été irrévocable
required:
  - txId
  - montant
  - payeurNumero
  - payeNumero
  - statut
  - dateEnvoi
