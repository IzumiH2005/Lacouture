type: object
properties:
  txId:
    type: string
    maxLength: 35
    description: Identifiant de la demande de paiement dans le SI du client

  categorie:
    type: string
    enum: ["631", "500", "521", "401"]
    description: Categorie de la demande de paiement

  payeAlias:
    type: string
    example: "9b1b2499-3e50-435b-b757-ac7a83d8aa8c"
    description: L'alias de compte dans lequel le client payé souhaite recevoir les paiements

  logoUrl:
    type: string
    description: L'URL du logo du business ou d'un produit du business qui sera affiché au client payeur

  payeurAlias:
    type: string
    example: "9b1b3499-3e50-435b-b757-ac7a83d8aa96"
    description: Alias de compte du client payeur à qui est adressée la demande

  confirmation:
    type: boolean
    description: |
      Lorsque le PSP reçoit la demande, il effectue une recherche d'alias en vue d'obtenir les informations de compte du client payeur.

      L'attribut `confirmation` permet au client d'indiquer à son PSP si celui-ci doit lui retourner les résultats de la recherche d'alias pour confirmation:

      * La valeur `true` de la confirmation indique au PSP qu'il doit retourner le résultat de la recherche d'alias au client et attendre une confirmation
      * La valeur `false` indique qu'une confirmation n'est pas requise pour la demande, de ce fait le PSP transmet directement la demande à PI

  remise:
    type: object
    description: Remise appliquée sur la demande de paiement
    properties:
      montant:
        type: number
        description: Le montant de la remise
      taux:
        type: number
        description: Le taux de la remise

  debitDiffere:
    type: boolean
    description: Indique si le client peut acheter maintenant et payer plus tard.

  montant:
    type: number
    description: Le montant total du paiement à effectuer

  montantAchat:
    type: number
    description: Le montant de l'achat

  montantRetrait:
    type: number
    description: Le montant du retrait

  montantFrais:
    type: number
    description: Les frais de retrait

  motif:
    type: string
    description: Le motif de la demande de paiement
    maxLength: 140

  refDocNumero:
    type: string
    description: Le numéro / la référence du document justificatif
    maxLength: 35

  refDocType:
    $ref: "../commons/RefDocType.yml"

  statut:
    type: string
    $ref: "./DemandePaiementStatut.yml"

  statutRaison:
    $ref: "./DemandePaiementStatutRaison.yml"

  payeurNom:
    type: string
    description: Le nom du payeur
  payeurPays:
    type: string
    description: Le pays de residence du payeur

  dateLimitePaiement:
    type: string
    format: date-time
    description: Date limite de paiement
  dateLimiteReponse:
    type: string
    format: date-time
    description: Date limite de réponse

  dateDemande:
    type: string
    format: date-time
    description: |
      Date de la demande de paiement
  dateConfirmation:
    type: string
    format: date-time
    description: |
      Date de confirmation de la demande si le client avait requis la confirmation de la demande de paiement.
      Il s'agit de la date et heure à laquelle le client a confirmé la demande.
  dateEnvoi:
    type: string
    format: date-time
    description: |
      Date d'envoi de la demande: date et heure à laquelle la demande de paiement est envoyée par le PSP
  dateReponse:
    type: string
    format: date-time
    description: |
      Date à laquelle le payeur à repondu à la demande de paiement
  dateIrrevocabilite:
    type: string
    format: date-time
    description: |
      Date à laquelle le paiement accepté est irrévocable
