# Modèle de liste des demandes de paiement
# DemandePaiementListe
type: object
required:
  - data
  - meta
properties:
  data:
    type: array
    items:
      $ref: "./DemandePaiementListeItem.yml"
  meta:
    type: object
    properties:
      total:
        type: integer
        description: Nombre total de demandes de paiement correspondant aux critères
        example: 150
      size:
        type: integer
        description: Nombre d'éléments par page
      page:
        type: string
        description: Identifiant de la page actuelle
      next:
        type: string
        description: Identifiant de la page suivante
      prev:
        type: string
        description: Identifiant de la page précédente
