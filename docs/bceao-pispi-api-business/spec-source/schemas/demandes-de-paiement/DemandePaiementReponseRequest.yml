type: object
oneOf:
  - title: Acceptation
    type: object
    properties:
      decision:
        type: boolean
        enum: [true]
        description: La décision à `true` indique l'acception de la demande de paiement.
    required:
      - decision

  - title: Rejet
    type: object
    properties:
      decision:
        type: boolean
        enum: [false]
        description: La décision à `false` indique le rejet de la demande de paiement.
      raison:
        type: string
        enum:
          - BE05
          - AM09
          - APAR
          - RR07
          - FR01
    required:
      - decision
      - raison
