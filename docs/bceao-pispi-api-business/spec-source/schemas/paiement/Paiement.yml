allOf:
  - $ref: "./PaiementRequestCommun.yml"
  - type: object
    properties:
      confirmation:
        type: boolean
        description: |
          Indique si une confirmation en deux étapes a été demandée lors de l'initiation du paiement.

      payeAlias:
        type: string
        description: L'alias du client payé (présent si le paiement a été initié par alias)
      payeIban:
        type: string
        description: L'IBAN du client payé (présent si le paiement a été initié par IBAN)
      payeOther:
        type: string
        description: Le numéro de compte du client payé (présent si le paiement a été initié par numéro de compte)
      payeParticipant:
        type: string
        pattern: (BJ|BF|CI|GW|ML|NE|SN|TG)[BCDEF]{1}[0-9]{3}
        minLength: 6
        maxLength: 6
        description: Code membre PI du participant destinataire (présent si le paiement a été initié par IBAN ou numéro de compte)

      payeNom:
        type: string
        description: Le nom du payé (Retourné dans le cas d'un paiement envoyé)
      payePays:
        type: string
        description: Le pays de residence du payé (Retourné dans le cas d'un paiement envoyé)

      payeurNom:
        type: string
        description: Le nom du payeur (Retourné dans le cas d'un paiement reçu)
      payeurPays:
        type: string
        description: Le pays de residence du payeur (Retourné dans le cas d'un paiement reçu)

      payeurCompte:
        type: string
        description: Le numéro de compte du payeur
      payeCompte:
        type: string
        description: Le numéro de compte du payé
      categorie:
        type: string
        enum:
          - "631"
          - "000"
          - "400"
          - "733"
          - "300"
          - "999"
          - "500"
          - "521"
          - "401"
        description: |
          La catégorie du paiement / Canal de paiement
          - `631` Demande de paiement provenant d'un particulier
          - `000` Paiement par QR Code Statique
          - `400` Paiement par QR Code Dynamique
          - `733` Ordre de paiement via l'API Business
          - `300` Via le canal USSD
          - `999` Ordre de transfert bancaire
          - `500` Demande de Paiement sur site 
          - `521` Demande de Paiement e-commerce 
          - `401` Autres demandes de paiement de facture

      statut:
        $ref: "./PaiementStatut.yml"
      statutRaison:
        $ref: "./PaiementStatutRaison.yml"
      end2endId:
        type: string
        description: Identifiant unique de bout en bout de la transaction
      instructionId:
        type: string
        description: Identifiant du paiement en masse dans le SI du client
      montantFrais:
        type: number
        description: Les frais appliqués par le participant (Optionnel - dépend du modèle de facturation utilisé par le participant)
      dateDemande:
        type: string
        format: date-time
        description: |
          Date de création du paiement: date et heure à laquelle le paiement a été initié par le client business.
      dateConfirmation:
        type: string
        format: date-time
        description: |
          Date de confirmation de la demande si le client payé avait requis la confirmation du paiement.
          Il s'agit de la date et heure à laquelle le client a confirmé la transaction.

          Pour un paiement reçu, cette date correspond à la date de confirmation du paiement par le payeur.
      dateEnvoi:
        type: string
        format: date-time
        description: |
          Date d'envoi de la demande: date et heure à laquelle le paiement est envoyé par le participant (PSP)
      dateIrrevocabilite:
        type: string
        format: date-time
        description: |
          Date à laquelle le paiement est irrévocable
      dateReponse:
        type: string
        format: date-time
        description: |
          Date à laquelle la réponse du paiement a été reçue

      # Données du retour de fonds
      retourStatut:
        $ref: "./RetourStatut.yml"
      retourStatutRaison:
        $ref: "./RetourStatutRaison.yml"
      retourDateDemande:
        type: string
        format: date-time
        description: |
          Date de création du paiement: date et heure à laquelle le retour de fonds a été initié par le client business.
      retourDateIrrevocabilite:
        type: string
        format: date-time
        description: |
          Date à laquelle le retour de fonds est irrévocable
      retourDateReponse:
        type: string
        format: date-time
        description: |
          Date à laquelle la réponse au retour de fonds a été reçue

      # Données de la demande d'annulation
      annulationStatut:
        $ref: "./AnnulationStatut.yml"
      annulationMotif:
        $ref: "./PaiementAnnulationMotif.yml"

      annulationStatutRaison:
        $ref: "./PaiementAnnulationStatutRaison.yml"
      annulationDateDemande:
        type: string
        format: date-time
        description: |
          Date de reception de la demande d'annulation par le participant
      annulationDateReponse:
        type: string
        format: date-time
        description: |
          Date à laquelle la réponse à la demande d'annulation a été reçue (Date de rejet de la demande)
