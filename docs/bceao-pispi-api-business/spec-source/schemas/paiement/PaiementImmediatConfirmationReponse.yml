# Reponse confirmation d'un paiement immédiat
# PaiementImmediatConfirmationReponse
allOf:
  - $ref: "./PaiementRequest.yml"
  - type: object
    properties:
      confirmation:
        type: boolean
        enum: [true]
        description: |
          Lorsque le PSP reçoit la demande, il vérifie l'identité du bénéficiaire
          (recherche d'alias, ou vérification du compte IBAN / numéro de compte selon le parcours)
          afin d'obtenir le nom et le pays du client payé.

          L'attribut `confirmation` permet au client d'indiquer à son PSP s'il doit lui retourner
          ces informations pour confirmation avant d'exécuter le paiement.
      statut:
        type: string
        enum: ["ENVOYE", "ANNULE"]
        description: |
          - `ENVOYE` si le business a confirmé l'envoi du paiement
          - `ANNULE` si le business a annulé l'envoi du paiement
      end2endId:
        type: string
        description: Identifiant unique de bout en bout de la transaction
      payeNom:
        type: string
        description: Le nom du payé
      payePays:
        type: string
        description: Le pays de residence du payé
      dateDemande:
        type: string
        format: date-time
        description: Date de création du paiement
      dateConfirmation:
        type: string
        format: date-time
        description: |
          Date de confirmation de la demande si le client payé avait requis la confirmation du paiement.
          Il s'agit de la date et heure à laquelle le business a confirmé l'envoi du paiement.
