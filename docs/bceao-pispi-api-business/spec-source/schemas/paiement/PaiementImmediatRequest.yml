# Modèle paiement pour un utilisateur
# PaiementImmediatRequest

oneOf:
  - title: Paiement initiée - confirmation demandée
    description: Paiement avec confirmation demandée
    allOf:
      - $ref: "./PaiementRequest.yml"
      - type: object
        properties:
          confirmation:
            type: boolean
            enum: [true]
            description: |
              Lorsque le PSP reçoit la demande, il vérifie l'identité du bénéficiaire
              (recherche d'alias, ou vérification du compte IBAN / numéro de compte selon le parcours)
              afin d'obtenir le nom et le pays du client payé.

              L'attribut `confirmation` permet au client d'indiquer à son PSP s'il doit lui retourner
              ces informations pour confirmation avant d'exécuter le paiement :

              - `true` : le PSP retourne `payeNom` et `payePays`, puis attend une validation via
                `PUT /paiements-envoyes/{txId}/confirmations` avant d'effectuer le paiement.
              - `false` : aucune validation n'est requise ; le PSP transmet la demande à PI sans attendre.
        additionalProperties: false
        required:
          - confirmation

  - title: Paiement envoyée sans confirmation
    description: Paiement envoyé sans confirmation
    allOf:
      - $ref: "./PaiementRequest.yml"
      - type: object
        properties:
          confirmation:
            type: boolean
            enum: [false]
            description: |
              Lorsque le PSP reçoit la demande, il vérifie l'identité du bénéficiaire
              (recherche d'alias, ou vérification du compte IBAN / numéro de compte selon le parcours)
              afin d'obtenir le nom et le pays du client payé.

              L'attribut `confirmation` permet au client d'indiquer à son PSP s'il doit lui retourner
              ces informations pour confirmation avant d'exécuter le paiement :

              - `true` : le PSP retourne `payeNom` et `payePays`, puis attend une validation via
                `PUT /paiements-envoyes/{txId}/confirmations` avant d'effectuer le paiement.
              - `false` : aucune validation n'est requise ; le PSP transmet la demande à PI sans attendre.
        additionalProperties: false
        required:
          - confirmation
