# PaiementRequest
# Identification exclusive du bénéficiaire : alias OU IBAN OU numéro de compte (OTHER)
# Les parcours IBAN et numéro de compte sont inter participant : `payeParticipant` est
# nécessairement différent du participant du business émetteur.
allOf:
  - $ref: "./PaiementRequestCommun.yml"
  - oneOf:
      - title: Paiement par alias
        description: |
          Le destinataire est identifié par son alias de compte.
          Les champs `payeIban`, `payeOther` et `payeParticipant` ne doivent pas être fournis.
        type: object
        properties:
          payeAlias:
            type: string
            example: "9b1b2499-3e50-435b-b757-ac7a83d8aa8c"
            description: L'alias du client payé, bénéficiaire de l'ordre de paiement
        required:
          - payeAlias
        additionalProperties: false

      - title: Paiement par IBAN
        description: |
          Le destinataire est identifié par son IBAN auprès d'une banque participante.
          Utiliser `GET /participants` pour obtenir le `payeParticipant` (code membre) des banques (`codeBanque` présent).
          Les champs `payeAlias` et `payeOther` ne doivent pas être fournis.
        type: object
        properties:
          payeIban:
            type: string
            example: "SN15SN0150101307430029018"
            description: |
              IBAN du bénéficiaire.
              Utilisé uniquement lorsque le participant destinataire est une banque.
          payeParticipant:
            type: string
            pattern: (BJ|BF|CI|GW|ML|NE|SN|TG)[BCDEF]{1}[0-9]{3}
            minLength: 6
            maxLength: 6
            example: "SNB015"
            description: Code membre PI du participant destinataire
        required:
          - payeIban
          - payeParticipant
        additionalProperties: false

      - title: Paiement par numéro de compte
        description: |
          Le destinataire est identifié par son numéro de compte (référence OTHER) auprès du participant destinataire.
          Ce parcours est ouvert à tous les participants, banques comprises.
          Utiliser `GET /participants` pour obtenir le `payeParticipant` (code membre).
          Les champs `payeAlias` et `payeIban` ne doivent pas être fournis.
        type: object
        properties:
          payeOther:
            type: string
            example: "12345678901234"
            description: |
              Numéro de compte du bénéficiaire (référence OTHER).
              Utilisable quel que soit le type de participant destinataire : les participants
              autres que les banques ne reçoivent que par ce parcours, et une banque peut
              également détenir un compte qui n'est pas un IBAN.
          payeParticipant:
            type: string
            pattern: (BJ|BF|CI|GW|ML|NE|SN|TG)[BCDEF]{1}[0-9]{3}
            minLength: 6
            maxLength: 6
            example: "CIE042"
            description: Code membre PI du participant destinataire
        required:
          - payeOther
          - payeParticipant
        additionalProperties: false
