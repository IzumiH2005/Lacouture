# Socle commun d'une requête de paiement
# PaiementRequestCommun
type: object
properties:
  txId:
    type: string
    description: Identifiant de la transaction dans le SI du client

  payeurAlias:
    type: string
    example: "9b1b3499-3e50-435b-b757-ac7a83d8aa96"
    description: |
      Le client business a la possibilité de préciser le compte qui sera débité pour le paiement.

  montant:
    type: number
    example: 15000
    description: Le montant du transfert à effectuer

  refDocNumero:
    type: string
    description: Le numéro / la référence du document justificatif
    maxLength: 35

  refDocType:
    $ref: "../commons/RefDocType.yml"

  motif:
    type: string
    description: Le motif du paiement
    maxLength: 140

  programme:
    type: boolean
    default: false
    description: Indique si le paiement executé est un paiement programmé

additionalProperties: false
required:
  - txId
  - montant
  - payeurAlias
