# Modèle Participant pour la liste
type: object
properties:
  codeMembre:
    type: string
    pattern: (BJ|BF|CI|GW|ML|NE|SN|TG)[BCDEF]{1}[0-9]{3}
    minLength: 6
    maxLength: 6
    description: Code membre du participant dans PI.
    example: "SNB015"
  nomMembre:
    type: string
    description: Nom du participant
    example: "Banque Exemple Sénégal"
  codeBanque:
    type: string
    description: |
      Code banque du participant.
      Présent uniquement lorsque le participant est une banque.
    example: "SN015"
  statut:
    $ref: "./ParticipantStatut.yml"
additionalProperties: false
required:
  - codeMembre
  - nomMembre
  - statut
