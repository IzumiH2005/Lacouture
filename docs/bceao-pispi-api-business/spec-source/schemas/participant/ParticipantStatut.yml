# Statut du participant dans PI
type: string
enum:
  - JOIN
  - ENBL
  - DSBL
  - DLTD
description: |
  Statut du participant dans la plateforme PI :
  - **JOIN** : Le participant est en cours d'enrôlement dans le système
  - **ENBL** : Le participant est actif
  - **DSBL** : Le participant est inactif / désactivé
  - **DLTD** : Le participant est supprimé du système PI
