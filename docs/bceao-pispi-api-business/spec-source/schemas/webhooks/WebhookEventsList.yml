# Modèle de notification webhook avec liste d'événements
# WebhookEventsList
type: object
required:
  - data
  - meta
properties:
  data:
    type: array
    description: Liste des événements notifiés
    items:
      $ref: "./WebhookEvent.yml"
  meta:
    type: object
    required:
      - total
    properties:
      total:
        type: integer
        description: Nombre total d'événements dans cette notification
        example: 1
