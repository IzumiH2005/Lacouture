# Modèle de liste des webhooks configurés
# WebhookList
type: object
required:
  - data
  - meta
properties:
  data:
    type: array
    description: Liste des webhooks configurés
    items:
      $ref: "./WebhookData.yml"
  meta:
    type: object
    required:
      - total
    properties:
      total:
        type: integer
        description: Nombre total de webhooks configurés
