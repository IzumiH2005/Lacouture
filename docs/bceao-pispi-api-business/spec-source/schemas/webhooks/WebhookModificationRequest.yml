type: object
properties:
  callbackUrl:
    type: string
    description: URL de callback
  alias:
    type: string
    description: Alias de compte
  events:
    type: array
    description: Événements
    items:
      type: string
      title: Type d'événement
      enum:
        - PAIEMENT_RECU
        - PAIEMENT_ENVOYE
        - PAIEMENT_REJETE
        - RTP_RECU
        - RTP_REJETE
        - ANNULATION_DEMANDE
        - ANNULATION_REJETE
        - RETOUR_ENVOYE
        - RETOUR_REJETE
        - RETOUR_RECU
oneOf:
  - required: ["callbackUrl"]
  - required: ["alias"]
  - required: ["events"]
